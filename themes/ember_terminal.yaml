# ✻ Ember Terminal – Theme für Home Assistant
# Ablegen unter: /config/themes/ember_terminal.yaml
# Warmes Fast-Schwarz, Glut-Orange als Akzent, Schrift: JetBrains Mono
# (wird über dashboard/ember-cards.js geladen, sonst Fallback auf Consolas/Menlo).

Ember Terminal:
  # ---------- Schrift ----------
  ha-font-family-body: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  ha-font-family-heading: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  ha-font-family-code: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  ha-font-family-longform: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  primary-font-family: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  paper-font-common-base_-_font-family: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  paper-font-common-code_-_font-family: '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace'
  mdc-typography-font-family: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'
  ha-card-header-font-family: '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace'

  # ---------- Farb-Skalen (HA-Design-Tokens) ----------
  ha-color-primary-05: "#1a0c07"
  ha-color-primary-10: "#2d140b"
  ha-color-primary-20: "#5a2a17"
  ha-color-primary-30: "#8a3f22"
  ha-color-primary-40: "#b8552f"
  ha-color-primary-50: "#d97757"
  ha-color-primary-60: "#e3906f"
  ha-color-primary-70: "#ebaa8e"
  ha-color-primary-80: "#f2c6b2"
  ha-color-primary-90: "#f8e2d8"
  ha-color-primary-95: "#fcf0ea"
  ha-color-neutral-05: "#0e0e0d"
  ha-color-neutral-10: "#141413"
  ha-color-neutral-20: "#1f1e1d"
  ha-color-neutral-30: "#33312d"
  ha-color-neutral-40: "#4a4843"
  ha-color-neutral-50: "#6f6d66"
  ha-color-neutral-60: "#8b897f"
  ha-color-neutral-70: "#a3a199"
  ha-color-neutral-80: "#c2bfb4"
  ha-color-neutral-90: "#e3e1d9"
  ha-color-neutral-95: "#f0eee6"

  # ---------- Grundfarben ----------
  primary-color: "#d97757"
  dark-primary-color: "#b8552f"
  light-primary-color: "#eba381"
  accent-color: "#d97757"
  rgb-primary-color: "217, 119, 87"
  rgb-accent-color: "217, 119, 87"
  text-primary-color: "#141413"
  text-light-primary-color: "#141413"
  primary-background-color: "#141413"
  rgb-primary-background-color: "20, 20, 19"
  secondary-background-color: "#1f1e1d"
  rgb-secondary-background-color: "31, 30, 29"
  primary-text-color: "#f0eee6"
  rgb-primary-text-color: "240, 238, 230"
  secondary-text-color: "#a3a199"
  rgb-secondary-text-color: "163, 161, 153"
  disabled-text-color: "#6f6d66"
  rgb-disabled-text-color: "111, 109, 102"
  divider-color: "#33312d"
  outline-color: "#33312d"
  outline-hover-color: "#4a4843"
  scrollbar-thumb-color: "#33312d"
  error-color: "#e5737f"
  warning-color: "#e6b450"
  success-color: "#8fbf7f"
  info-color: "#8fa8d8"
  rgb-error-color: "229, 115, 127"
  rgb-warning-color: "230, 180, 80"
  rgb-success-color: "143, 191, 127"
  rgb-info-color: "143, 168, 216"
  lovelace-background: "radial-gradient(1100px 520px at 0% -10%, rgba(217,119,87,0.10), transparent 60%), radial-gradient(900px 500px at 110% 0%, rgba(177,185,249,0.05), transparent 60%), #141413"

  # ---------- Karten ----------
  card-background-color: "#1f1e1d"
  ha-card-background: "#1f1e1d"
  ha-card-border-color: "#33312d"
  ha-card-border-width: "1px"
  ha-card-border-radius: "14px"
  ha-card-box-shadow: "none"
  ha-card-header-color: "#f0eee6"
  ha-card-header-font-size: "15px"
  ha-section-title-font-size: "15px"
  ha-tile-icon-border-radius: "10px"
  markdown-code-background-color: "#141413"
  code-editor-background-color: "#141413"

  # ---------- Kopfzeile & Seitenleiste ----------
  app-header-background-color: "#141413"
  app-header-text-color: "#f0eee6"
  app-header-border-bottom: "1px solid #33312d"
  app-header-edit-background-color: "#2a2926"
  app-header-edit-text-color: "#d97757"
  sidebar-background-color: "#0e0e0d"
  sidebar-text-color: "#a3a199"
  sidebar-icon-color: "#6f6d66"
  sidebar-selected-text-color: "#f0eee6"
  sidebar-selected-icon-color: "#d97757"
  sidebar-menu-button-text-color: "#f0eee6"
  sidebar-menu-button-background-color: "#0e0e0d"

  # ---------- Status-Farben ----------
  state-icon-color: "#a3a199"
  state-active-color: "#d97757"
  state-inactive-color: "#6f6d66"
  state-unavailable-color: "#4a4843"
  state-on-color: "#d97757"
  state-off-color: "#6f6d66"
  state-home-color: "#8fbf7f"
  state-not_home-color: "#6f6d66"
  state-switch-active-color: "#d97757"
  state-input_boolean-active-color: "#d97757"
  state-light-active-color: "#e6b450"
  state-fan-active-color: "#8fa8d8"
  state-cover-active-color: "#b1b9f9"
  state-media_player-active-color: "#b1b9f9"
  state-binary_sensor-active-color: "#e6b450"
  state-lock-locked-color: "#8fbf7f"
  state-lock-unlocked-color: "#e5737f"
  state-alarm_control_panel-armed_away-color: "#8fbf7f"
  state-alarm_control_panel-disarmed-color: "#6f6d66"
  state-alarm_control_panel-triggered-color: "#e5737f"
  state-climate-heat-color: "#d97757"
  state-climate-cool-color: "#8fa8d8"
  state-climate-auto-color: "#8fbf7f"
  state-climate-heat_cool-color: "#e6b450"
  state-climate-dry-color: "#e6b450"
  state-climate-fan_only-color: "#8fa8d8"
  state-climate-off-color: "#6f6d66"
  state-sensor-battery-high-color: "#8fbf7f"
  state-sensor-battery-medium-color: "#e6b450"
  state-sensor-battery-low-color: "#e5737f"
  state-person-home-color: "#8fbf7f"
  state-person-not_home-color: "#6f6d66"
  paper-item-icon-color: "#a3a199"
  paper-item-icon-active-color: "#d97757"
  history-unavailable-color: "#33312d"
  history-unknown-color: "#4a4843"

  # ---------- Bedienelemente ----------
  mdc-theme-primary: "#d97757"
  mdc-theme-secondary: "#d97757"
  mdc-theme-on-primary: "#141413"
  mdc-theme-on-secondary: "#141413"
  mdc-theme-surface: "#1f1e1d"
  mdc-theme-on-surface: "#f0eee6"
  mdc-theme-text-primary-on-background: "#f0eee6"
  mdc-theme-text-secondary-on-background: "#a3a199"
  mdc-theme-text-icon-on-background: "#a3a199"
  mdc-ripple-color: "#d97757"
  switch-checked-color: "#d97757"
  switch-checked-button-color: "#f0eee6"
  switch-checked-track-color: "#d97757"
  switch-unchecked-button-color: "#a3a199"
  switch-unchecked-track-color: "#33312d"
  slider-color: "#d97757"
  slider-secondary-color: "rgba(217, 119, 87, 0.35)"
  slider-track-color: "#33312d"
  input-fill-color: "#2a2926"
  input-disabled-fill-color: "#1f1e1d"
  input-ink-color: "#f0eee6"
  input-label-ink-color: "#a3a199"
  input-disabled-ink-color: "#6f6d66"
  input-idle-line-color: "#4a4843"
  input-hover-line-color: "#a3a199"
  input-outlined-idle-border-color: "#33312d"
  input-outlined-hover-border-color: "#4a4843"
  input-dropdown-icon-color: "#a3a199"
  codemirror-keyword: "#d97757"
  codemirror-property: "#b1b9f9"
  codemirror-string: "#8fbf7f"
  codemirror-number: "#e6b450"
  codemirror-comment: "#6f6d66"

  # ---------- Formularfelder (Auswahl, Eingabe) ----------
  ha-color-form-background: "#2a2926"
  ha-color-form-background-hover: "#33312d"
  ha-color-form-background-disabled: "#1f1e1d"
  mdc-select-fill-color: "#2a2926"
  mdc-select-ink-color: "#f0eee6"
  mdc-select-label-ink-color: "#a3a199"
  mdc-select-idle-line-color: "#4a4843"
  mdc-select-hover-line-color: "#a3a199"
  mdc-select-dropdown-icon-color: "#a3a199"
  mdc-select-disabled-fill-color: "#1f1e1d"
  mdc-select-disabled-ink-color: "#6f6d66"
  mdc-text-field-fill-color: "#2a2926"
  mdc-text-field-ink-color: "#f0eee6"
  mdc-text-field-label-ink-color: "#a3a199"
  mdc-text-field-idle-line-color: "#4a4843"
  mdc-text-field-hover-line-color: "#a3a199"
  mdc-text-field-disabled-fill-color: "#1f1e1d"
  mdc-text-field-disabled-ink-color: "#6f6d66"
  mdc-text-area-outlined-idle-border-color: "#33312d"
  mdc-text-area-outlined-hover-border-color: "#4a4843"
  ha-color-surface-default: "#1f1e1d"
  ha-color-surface-low: "#141413"
  ha-color-on-surface-default: "#f0eee6"

  # ---------- Dialoge & Tabellen ----------
  ha-dialog-surface-background: "#1f1e1d"
  ha-dialog-border-radius: "16px"
  mdc-dialog-scrim-color: "rgba(10, 10, 9, 0.7)"
  dialog-backdrop-filter: "blur(4px)"
  data-table-background-color: "#1f1e1d"
  table-row-background-color: "#1f1e1d"
  table-row-alternative-background-color: "#232220"
  table-header-background-color: "#141413"
  ha-assist-chip-filled-container-color: "#2a2926"
  ha-label-badge-color: "#d97757"
  label-badge-red: "#e5737f"
  label-badge-blue: "#8fa8d8"
  label-badge-green: "#8fbf7f"
  label-badge-yellow: "#e6b450"
  label-badge-grey: "#6f6d66"
  label-badge-background-color: "#1f1e1d"
  label-badge-text-color: "#f0eee6"

  # ---------- Energie & Diagramme ----------
  energy-grid-consumption-color: "#e5737f"
  energy-grid-return-color: "#b1b9f9"
  energy-solar-color: "#e6b450"
  energy-non-fossil-color: "#8fbf7f"
  energy-battery-out-color: "#8fbf7f"
  energy-battery-in-color: "#d97757"
  energy-gas-color: "#8fa8d8"
  energy-water-color: "#6fb3a8"
  graph-color-1: "#d97757"
  graph-color-2: "#8fbf7f"
  graph-color-3: "#e6b450"
  graph-color-4: "#b1b9f9"
  graph-color-5: "#6fb3a8"
  graph-color-6: "#e5737f"
  graph-color-7: "#8fa8d8"
  graph-color-8: "#eba381"
  graph-color-9: "#c2bfb4"
  graph-color-10: "#a38bd4"

  # ---------- Mushroom (installierte Karten) ----------
  mush-rgb-orange: "217, 119, 87"
  mush-rgb-amber: "230, 180, 80"
  mush-rgb-green: "143, 191, 127"
  mush-rgb-blue: "143, 168, 216"
  mush-rgb-red: "229, 115, 127"
  mush-rgb-disabled: "111, 109, 102"
  mush-chip-background: "#2a2926"
  mush-chip-border-radius: "8px"
  mush-card-primary-font-weight: "500"
  mush-icon-border-radius: "10px"

  # ---------- Als dunkles Theme kennzeichnen ----------
  # Nur ein dunkler Modus: Home Assistant nutzt damit die dunklen
  # Varianten aller internen Farben (Formulare, Menüs, Dialoge).
  modes:
    dark: {}
